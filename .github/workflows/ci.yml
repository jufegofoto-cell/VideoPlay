# VLC Zoom Player: pruebas y ejecutable de Windows.
# NO se ejecuta solo: se lanza a mano desde la pestaña Actions →
# "CI" → botón "Run workflow".
name: CI

on:
  workflow_dispatch:
    inputs:
      ejecutable:
        description: "Generar el ejecutable de Windows"
        type: boolean
        default: true
      version:
        description: "Publicar un Release con esta versión (ej. v0.4.0). Vacío = no publicar"
        type: string
        default: ""

permissions:
  contents: write   # necesario solo para publicar el Release

jobs:
  tests:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyflakes
      - name: Análisis estático
        run: python -m pyflakes vlc_zoom_player tools tests
      - name: Pruebas unitarias
        run: python -m pytest -v

  windows-exe:
    name: Ejecutable de Windows
    needs: tests
    if: ${{ inputs.ejecutable }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Construir VLCZoomPlayer.exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name VLCZoomPlayer
          --paths .
          tools/pyinstaller_entry.py
      - name: Empaquetar
        shell: pwsh
        run: |
          # La app usa el VLC instalado en el equipo: nunca empaquetar una copia
          # de libVLC (sin sus plugins no arranca).
          Remove-Item dist/VLCZoomPlayer/_internal/libvlc*.dll -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE dist/VLCZoomPlayer/
          Compress-Archive -Path dist/VLCZoomPlayer -DestinationPath VLCZoomPlayer-windows.zip
      - name: Subir artefacto
        uses: actions/upload-artifact@v6
        with:
          name: VLCZoomPlayer-windows
          path: VLCZoomPlayer-windows.zip
      - name: Publicar Release
        if: ${{ inputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: VLC Zoom Player ${{ inputs.version }}
          files: VLCZoomPlayer-windows.zip
          generate_release_notes: true
